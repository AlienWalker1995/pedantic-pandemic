<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The Pedantic Pandemic: a vague request passes through five pedantic personas in order, Product, UX, Frontend, Backend, DevOps, and comes out as a spec with logged assumptions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130d"/>
      <stop offset="1" stop-color="#0f1f17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4ade80"/>
    </marker>
    <!-- one virion: a body with eight spikes -->
    <g id="virion">
      <g stroke="#4ade80" stroke-width="3" stroke-linecap="round">
        <path d="M0 -30V-40M0 30V40M-30 0H-40M30 0H40M-21 -21L-28 -28M21 21L28 28M-21 21L-28 28M21 -21L28 -28"/>
      </g>
      <g fill="#4ade80">
        <circle cx="0" cy="-42" r="4"/><circle cx="0" cy="42" r="4"/><circle cx="-42" cy="0" r="4"/><circle cx="42" cy="0" r="4"/>
        <circle cx="-30" cy="-30" r="4"/><circle cx="30" cy="30" r="4"/><circle cx="-30" cy="30" r="4"/><circle cx="30" cy="-30" r="4"/>
      </g>
      <circle r="30" fill="#0b1f14" stroke="#4ade80" stroke-width="3"/>
    </g>
    <style>
      .cap{fill:#86efac;font-size:13px;letter-spacing:1.6px;font-weight:600;}
      .role{fill:#ecfdf5;font-size:17px;font-weight:700;}
      .q{fill:#a7f3d0;font-size:13px;font-style:italic;}
      .num{fill:#4ade80;font-size:20px;font-weight:800;}
      .flow{stroke:#4ade80;stroke-width:2;fill:none;stroke-dasharray:6 5;}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;}
    </style>
  </defs>

  <rect width="1200" height="480" rx="18" fill="url(#bg)"/>
  <ellipse cx="600" cy="250" rx="560" ry="200" fill="url(#glow)"/>

  <!-- title -->
  <text x="600" y="66" text-anchor="middle" fill="#ecfdf5" font-size="34" font-weight="800" letter-spacing="1">THE PEDANTIC PANDEMIC</text>
  <text x="600" y="96" text-anchor="middle" fill="#86efac" font-size="16">an outbreak of questions you can't escape · there is no cure, only answers</text>

  <!-- patient zero -->
  <text class="cap" x="40" y="168">PATIENT ZERO</text>
  <rect x="40" y="182" width="150" height="96" rx="12" fill="#10261a" stroke="#1f5135"/>
  <text x="115" y="220" text-anchor="middle" fill="#ecfdf5" font-size="17" class="mono">"just add</text>
  <text x="115" y="244" text-anchor="middle" fill="#ecfdf5" font-size="17" class="mono">a button"</text>
  <text x="115" y="266" text-anchor="middle" fill="#6ee7b7" font-size="12">0 questions asked</text>

  <path class="flow" d="M196 230 H232" marker-end="url(#arrow)"/>

  <!-- the five members, in order -->
  <g transform="translate(290 230)"><use href="#virion"/><text class="num" y="7" text-anchor="middle">1</text></g>
  <text class="role" x="290" y="310" text-anchor="middle">Product</text>
  <text class="q" x="290" y="330" text-anchor="middle">why does it matter</text>
  <text class="q" x="290" y="346" text-anchor="middle">in the market?</text>

  <path class="flow" d="M340 230 H384" marker-end="url(#arrow)"/>
  <g transform="translate(440 230)"><use href="#virion"/><text class="num" y="7" text-anchor="middle">2</text></g>
  <text class="role" x="440" y="310" text-anchor="middle">UX</text>
  <text class="q" x="440" y="330" text-anchor="middle">how will users</text>
  <text class="q" x="440" y="346" text-anchor="middle">experience it?</text>

  <path class="flow" d="M490 230 H534" marker-end="url(#arrow)"/>
  <g transform="translate(590 230)"><use href="#virion"/><text class="num" y="7" text-anchor="middle">3</text></g>
  <text class="role" x="590" y="310" text-anchor="middle">Frontend</text>
  <text class="q" x="590" y="330" text-anchor="middle">why does it matter</text>
  <text class="q" x="590" y="346" text-anchor="middle">in the client?</text>

  <path class="flow" d="M640 230 H684" marker-end="url(#arrow)"/>
  <g transform="translate(740 230)"><use href="#virion"/><text class="num" y="7" text-anchor="middle">4</text></g>
  <text class="role" x="740" y="310" text-anchor="middle">Backend</text>
  <text class="q" x="740" y="330" text-anchor="middle">why does it matter</text>
  <text class="q" x="740" y="346" text-anchor="middle">technically?</text>

  <path class="flow" d="M790 230 H834" marker-end="url(#arrow)"/>
  <g transform="translate(890 230)"><use href="#virion"/><text class="num" y="7" text-anchor="middle">5</text></g>
  <text class="role" x="890" y="310" text-anchor="middle">DevOps</text>
  <text class="q" x="890" y="330" text-anchor="middle">how does it ship</text>
  <text class="q" x="890" y="346" text-anchor="middle">and operate?</text>

  <path class="flow" d="M940 230 H996" marker-end="url(#arrow)"/>

  <!-- the outcome -->
  <text class="cap" x="1004" y="168">PROGNOSIS</text>
  <rect x="1004" y="182" width="156" height="96" rx="12" fill="#14532d" stroke="#22c55e"/>
  <text x="1082" y="220" text-anchor="middle" fill="#ecfdf5" font-size="20" font-weight="700">a spec</text>
  <text x="1082" y="244" text-anchor="middle" fill="#bbf7d0" font-size="13">assumptions logged</text>
  <text x="1082" y="262" text-anchor="middle" fill="#bbf7d0" font-size="13">before any code</text>

  <text x="600" y="430" text-anchor="middle" fill="#6ee7b7" font-size="15">Only good questions. Relentless rounds until you say stop.</text>
</svg>
